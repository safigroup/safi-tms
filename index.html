<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safi TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- Vendored locally (was cdn.jsdelivr.net) so the app still boots on networks that
       block third-party CDNs — border posts and corporate wifi being the two that matter
       here. Currently v2.112.3. To update: re-download from
       https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2 and replace vendor/supabase-js.min.js -->
  <script src="vendor/supabase-js.min.js"></script>
  <style>
    :root {
      --ground: #DCE0D9;
      --card: #F7F8F4;
      --ink: #141E19;
      --ink-soft: #5A655E;
      --rule: #B4BBB0;
      --rule-soft: #CFD4CA;
      --stamp: #3D2A6B;
      --settled: #0B6B4F;
      --alert: #8C2F1E;
      --waiting: #8A6A12;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      --cond: 'Archivo Narrow', var(--sans);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 18px 64px
    }

    /* masthead + nav */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 9px;
      margin-bottom: 14px
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 11px
    }

    .brand h1 {
      font-family: var(--cond);
      font-weight: 700;
      font-size: 25px;
      letter-spacing: .07em;
      text-transform: uppercase
    }

    .brand .sub {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-soft);
      letter-spacing: .14em;
      text-transform: uppercase
    }

    .who {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-soft);
      text-align: right
    }

    .who button {
      background: none;
      border: none;
      color: var(--stamp);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      text-decoration: underline;
      padding: 0
    }

    nav {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    nav button {
      font-family: var(--cond);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: .13em;
      text-transform: uppercase;
      padding: 9px 15px;
      border: 1px solid var(--rule);
      background: var(--card);
      cursor: pointer;
      border-radius: 2px;
      color: var(--ink-soft)
    }

    nav button.on {
      background: var(--stamp);
      border-color: var(--stamp);
      color: #fff
    }

    nav .n {
      font-family: var(--mono);
      font-size: 10px;
      opacity: .65;
      margin-left: 5px
    }

    nav .n.alert {
      opacity: 1;
      color: var(--waiting)
    }

    nav button.on .n {
      opacity: .75;
      color: #fff
    }

    /* strip */
    .strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
      margin-bottom: 16px
    }

    .strip .cell {
      background: var(--card);
      padding: 11px 14px
    }

    .strip .k {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-soft)
    }

    .strip .v {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 3px
    }

    .strip .v.warn {
      color: var(--waiting)
    }

    .strip .v.bad {
      color: var(--alert)
    }

    .strip .v.pos {
      color: var(--settled)
    }

    .strip .n {
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 1px
    }

    @media(max-width:780px) {
      .strip {
        grid-template-columns: 1fr 1fr
      }
    }

    /* layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 406px;
      gap: 18px;
      align-items: start
    }

    @media(max-width:1000px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 2px
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--rule)
    }

    .panel-head h2 {
      font-family: var(--cond);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase
    }

    .panel-body {
      padding: 16px
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--rule)
    }

    .tabs button {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 11px 8px;
      cursor: pointer;
      font-family: var(--cond);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--ink-soft)
    }

    .tabs button.on {
      color: var(--stamp);
      border-bottom-color: var(--stamp)
    }

    .tabs .c {
      font-family: var(--mono);
      font-size: 10px;
      opacity: .7;
      margin-left: 4px
    }

    .badge {
      font-family: var(--mono);
      font-size: 9.5px;
      background: var(--waiting);
      color: #fff;
      padding: 1px 5px;
      margin-left: 5px;
      border-radius: 8px;
      letter-spacing: 0
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--rule);
      background: #F2F3EE
    }

    .chip {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid var(--rule);
      background: #fff;
      cursor: pointer;
      border-radius: 2px;
      color: var(--ink-soft)
    }

    .chip.on {
      background: var(--stamp);
      border-color: var(--stamp);
      color: #fff
    }

    .chip .c {
      opacity: .65;
      margin-left: 4px
    }

    /* lists */
    ul.list {
      list-style: none;
      max-height: 600px;
      overflow-y: auto
    }

    ul.list li {
      padding: 11px 16px;
      border-bottom: 1px solid var(--rule-soft);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 11px;
      align-items: flex-start
    }

    ul.list li.tap {
      cursor: pointer
    }

    ul.list li.tap:hover {
      background: #F2F3EE
    }

    ul.list li.sel {
      background: #EFECF5;
      box-shadow: inset 3px 0 0 var(--stamp)
    }

    ul.list li.off {
      opacity: .5
    }

    .r-no {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--ink-soft)
    }

    .r-title {
      font-family: var(--cond);
      font-weight: 600;
      font-size: 16px;
      margin-top: 1px
    }

    .r-sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 1px
    }

    .r-mono {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-soft);
      margin-top: 2px
    }

    .r-mono a {
      color: var(--stamp)
    }

    .r-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 6px
    }

    .r-right {
      text-align: right;
      white-space: nowrap
    }

    .r-amt {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    .r-amt.pos {
      color: var(--settled)
    }

    .r-amt.neg {
      color: var(--alert)
    }

    .r-min {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-soft)
    }

    .x {
      background: none;
      border: none;
      color: var(--rule);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 14px;
      padding: 0 0 0 8px
    }

    .x:hover {
      color: var(--alert)
    }

    .pill {
      display: inline-block;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 2px 6px;
      border: 1px solid;
      border-radius: 2px
    }

    .pill.grey {
      color: var(--ink-soft);
      border-color: var(--rule)
    }

    .pill.violet {
      color: var(--stamp);
      border-color: var(--stamp)
    }

    .pill.warn {
      color: var(--waiting);
      border-color: var(--waiting);
      background: #FAF6EA
    }

    .pill.good {
      color: var(--settled);
      border-color: var(--settled);
      background: #EDF4F0
    }

    .pill.bad {
      color: var(--alert);
      border-color: var(--alert);
      background: #FAEFEC
    }

    /* detail */
    .d-head {
      padding: 15px 16px;
      background: #F2F3EE;
      border-bottom: 1px solid var(--rule)
    }

    .d-figs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px
    }

    .d-figs .k {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-soft)
    }

    .d-figs .v {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px
    }

    .d-figs .v.pos {
      color: var(--settled)
    }

    .d-figs .v.neg,
    .d-figs .v.bad {
      color: var(--alert)
    }

    .d-sec {
      padding: 13px 16px;
      border-bottom: 1px solid var(--rule-soft)
    }

    .d-sec h3 {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 9px
    }

    .d-kv {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      padding: 3px 0
    }

    .d-kv span:first-child {
      color: var(--ink-soft)
    }

    .d-kv span:last-child {
      font-family: var(--mono);
      font-size: 12.5px;
      text-align: right
    }

    .d-hint {
      font-size: 12.5px;
      color: var(--ink-soft)
    }

    .acts {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .act {
      font-family: var(--cond);
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 8px 11px;
      border: 1px solid var(--stamp);
      background: none;
      color: var(--stamp);
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap
    }

    .act:hover {
      background: var(--stamp);
      color: #fff
    }

    .act.go {
      border-color: var(--settled);
      color: var(--settled)
    }

    .act.go:hover {
      background: var(--settled);
      color: #fff
    }

    .act:disabled {
      border-color: var(--rule);
      color: var(--rule);
      cursor: not-allowed;
      background: none
    }

    /* forms */
    .field {
      margin-bottom: 13px
    }

    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 5px
    }

    .field .hint {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-soft);
      margin-top: 4px
    }

    input,
    select {
      width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 9px 11px
    }

    input[type=number] {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--stamp);
      outline-offset: -1px;
      border-color: var(--stamp)
    }

    .row {
      display: grid;
      gap: 11px;
      grid-template-columns: 1fr 1fr
    }

    .row3 {
      display: grid;
      gap: 11px;
      grid-template-columns: 1.4fr .8fr .8fr
    }

    @media(max-width:560px) {

      .row,
      .row3 {
        grid-template-columns: 1fr
      }
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 13px
    }

    .check input {
      width: auto
    }

    .check label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0
    }

    button.primary {
      width: 100%;
      background: var(--stamp);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-family: var(--cond);
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer
    }

    button.primary:hover {
      background: #32215A
    }

    button.primary.settle {
      background: var(--settled)
    }

    button.primary.settle:hover {
      background: #085239
    }

    button.primary:disabled {
      background: var(--rule);
      cursor: not-allowed
    }

    button.ghost {
      width: 100%;
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-soft);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 9px;
      cursor: pointer;
      margin-top: 8px;
      border-radius: 2px
    }

    button.ghost:hover {
      border-color: var(--ink);
      color: var(--ink)
    }

    button.ghost.danger:hover {
      border-color: var(--alert);
      color: var(--alert)
    }

    /* conversion stamp + fx mirror */
    .stamp {
      margin: 2px 0 16px;
      border: 1px dashed var(--rule);
      border-left: 3px solid var(--stamp);
      background: linear-gradient(180deg, #fff, #F2F3EE);
      padding: 12px 14px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      transition: border-left-color .18s ease
    }

    .stamp.live {
      border-left-color: var(--settled)
    }

    .stamp .native {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums
    }

    .stamp .arrow {
      font-family: var(--mono);
      color: var(--rule);
      font-size: 15px
    }

    .stamp .usd {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 23px;
      color: var(--settled);
      font-variant-numeric: tabular-nums
    }

    .stamp .usd.idle {
      color: var(--rule)
    }

    .stamp .rate {
      width: 100%;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-soft);
      letter-spacing: .05em;
      padding-top: 6px;
      border-top: 1px solid var(--rule-soft);
      margin-top: 4px
    }

    .stamp .rate b {
      font-weight: 500;
      color: var(--ink)
    }

    /* file capture */
    .capture {
      border: 1px dashed var(--rule);
      background: #fff;
      padding: 11px 13px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      flex-wrap: wrap
    }

    .capture.has {
      border-style: solid;
      border-color: var(--settled);
      background: #F2F7F4
    }

    .capture input[type=file] {
      display: none
    }

    .capture .btn {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--stamp);
      border: 1px solid var(--stamp);
      background: none;
      padding: 7px 12px;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap
    }

    .capture .btn:hover {
      background: var(--stamp);
      color: #fff
    }

    .capture .state {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-soft);
      flex: 1;
      min-width: 110px
    }

    .capture .state b {
      color: var(--settled);
      font-weight: 500
    }

    .capture .clear {
      background: none;
      border: none;
      color: var(--rule);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 13px
    }

    .thumb {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border: 1px solid var(--rule)
    }

    .pod-call {
      margin: 13px 16px;
      border-left: 3px solid var(--waiting);
      background: #FAF6EA;
      padding: 12px 14px
    }

    .pod-call p {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-bottom: 10px
    }

    .pod-call b {
      color: var(--ink)
    }

    .mirror {
      border: 1px dashed var(--rule);
      border-left: 3px solid var(--stamp);
      background: linear-gradient(180deg, #fff, #F2F3EE);
      padding: 12px 14px;
      margin-bottom: 14px
    }

    .mirror.live {
      border-left-color: var(--settled)
    }

    .mirror .big {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    .mirror .big.on {
      color: var(--settled)
    }

    .mirror .small {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-soft);
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid var(--rule-soft)
    }

    .empty {
      padding: 36px 18px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 13.5px
    }

    .note {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 10px 14px;
      border-left: 3px solid var(--stamp);
      background: #F2F3EE;
      margin-bottom: 14px
    }

    .note.bad {
      border-left-color: var(--alert);
      color: var(--alert)
    }

    .note.good {
      border-left-color: var(--settled);
      color: var(--settled)
    }

    .note.warn {
      border-left-color: var(--waiting);
      color: var(--waiting)
    }

    .gate {
      max-width: 400px;
      margin: 70px auto
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 11px 18px;
      border-radius: 2px;
      z-index: 99;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .22)
    }

    /* print sheet */
    #sheet {
      display: none
    }

    @media print {
      body {
        background: #fff
      }

      .wrap {
        display: none !important
      }

      #sheet {
        display: block !important
      }

      @page {
        size: A4;
        margin: 16mm
      }
    }

    #sheet .ih {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 2px solid #141E19;
      padding-bottom: 12px
    }

    #sheet .co h1 {
      font-family: var(--cond);
      font-size: 22px;
      letter-spacing: .05em;
      text-transform: uppercase;
      font-weight: 700
    }

    #sheet .co p {
      font-size: 11px;
      color: #444;
      line-height: 1.5
    }

    #sheet .im {
      text-align: right;
      font-family: var(--mono);
      font-size: 11px
    }

    #sheet .im .big {
      font-family: var(--cond);
      font-size: 20px;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 6px
    }

    #sheet .parties {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin: 20px 0
    }

    #sheet .parties h4 {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 4px
    }

    #sheet table {
      width: 100%;
      border-collapse: collapse;

<body>
  <div class="wrap">

                autocomplete="current-password"></div>

    <div id="app" style="display:none">
      <nav id="nav"></nav>
      <div id="warn"></div>
      <div id="main"></div>
    </div>
  </div>
  <div id="sheet"></div>

  <script>
    // =====================================================================
    // CONFIG — Dashboard > Settings > API Keys. Use the PUBLISHABLE key.
    // =====================================================================
    const SUPABASE_URL = "https://shvvpcmcezkfzdvelhpl.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_mwaEiMwvj8E05ZgDW9Lmhw_yuTZ5fK7";

    // Printed on every invoice.
    const COMPANY = {
      name: "SAFI TRANSPORT AND LOGISTICS LIMITED",
      reg: "PACRA Reg. No. 120261044060",
      address: "<<< REPLACE: Plot number, Lusaka, Zambia >>>",
      phone: "<<< REPLACE: +260 ... >>>",
      email: "<<< REPLACE: accounts@... >>>",
      bank: ["<<< REPLACE: Bank name >>>",
        "Account name: Safi Transport and Logistics Limited",
        "USD Account: <<< REPLACE >>>", "SWIFT: <<< REPLACE >>>"]
    };
    // =====================================================================

    const BUCKET = "trip-docs";
    const $ = id => document.getElementById(id);
    const cfgOk = !SUPABASE_URL.includes("REPLACE") && !SUPABASE_KEY.includes("REPLACE");

    // ---------------------------------------------------------------------
    // One shared state object. Every view reads from this; nothing refetches
    // what another view already loaded.
    // ---------------------------------------------------------------------
    const S = {
      sb: null, org: null, orgName: "", role: "", email: "",
      view: "board", trip: null,          // active trip carries across views
      rates: {}, master: {}, board: [], billable: [], ar: [], fetchErrors: [],
      costs: [], docs: [], tripFetchError: null, // for the active trip
      filter: "active", bucket: "open", adminView: "fx", adminSel: null,
      docTab: "ledger", billTab: "bill", billSel: null,
      costFile: null, docFile: null
    };

    // ---------- helpers ----------
    const esc = s => String(s ?? "").replace(/[&<>"]/g, x => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
    const m2 = (n, c = "USD") => c + " " + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const m0 = (n, c = "USD") => c + " " + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
    const num = n => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
    const lab = s => String(s || "").replace(/_/g, " ");
    const today = () => new Date().toISOString().slice(0, 10);
    const el = (id, html) => { const e = $(id); if (e) e.innerHTML = html; };
    function note(id, msg, kind) { el(id, msg ? `<div class="note ${kind || ""}">${msg}</div>` : ""); }
    // note() trusts its caller's markup (several call sites embed an <a> link on purpose) —
    // this escapes just the untrusted part, a Postgres/Supabase error string, before it's spliced in.
    const errMsg = e => esc(e?.message || e || "");
    function toast(msg) {
      const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
    }
    // Disables a button (or group of related buttons) for the life of an in-flight
    // request, so a slow connection can't turn one tap into a double-submit.
    // Returns a restore() that puts each button back to its OWN prior disabled
    // state — needed because some buttons in a group (e.g. an already-raised
    // invoice half) are meant to stay disabled even after the request settles.
    function busyGroup(btns) {
      const arr = Array.isArray(btns) ? btns : [btns];
      const prev = arr.map(b => b.disabled);
      arr.forEach(b => b.disabled = true);
      return () => arr.forEach((b, i) => b.disabled = prev[i]);
    }
    const PILL = {
      draft: "grey", allocated: "grey", loading: "violet", in_transit: "violet",
      at_border: "warn", delivered: "warn", pod_received: "good", invoiced: "good", closed: "grey"
    };

    // ---------- boot ----------
    (async function () {
      if (!cfgOk) {
        $("gate").style.display = "block"; $("gateTitle").textContent = "Not configured";
        $("loginForm").style.display = "none";
        note("gateNote", "Replace SUPABASE_URL and SUPABASE_KEY near the bottom of the script, then reload.", "bad");
        return;
      }
      if (typeof supabase === "undefined") {
        $("gate").style.display = "block"; $("gateTitle").textContent = "Couldn't load";
        $("loginForm").style.display = "none";
        note("gateNote", "vendor/supabase-js.min.js didn't load — check it was deployed alongside this file, then reload.", "bad");
        return;
      }
      S.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data: { session } } = await S.sb.auth.getSession();
      session ? boot(session) : ($("gate").style.display = "block");
    })();

    $("loginBtn").onclick = async () => {
      const b = $("loginBtn"); b.disabled = true; b.textContent = "Signing in…";
      const { data, error } = await S.sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
      b.disabled = false; b.textContent = "Sign in";
      if (error) return note("gateNote", "That didn't work: " + errMsg(error), "bad");
      boot(data.session);
    };
    ["email", "password"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click() }));

    async function boot(session) {
      $("gate").style.display = "none"; $("app").style.display = "block";
      S.email = session.user.email;
      const { data: mem } = await S.sb.from("memberships").select("org_id, role, organizations(name, trip_prefix)").limit(1).maybeSingle();
      if (!mem) {
        el("main", '<div class="panel"><div class="panel-body"><div class="note bad">This account isn\'t a member of any organisation yet. Add a row to memberships linking your user to an org, then reload.</div></div></div>');
        return;
      }
      S.org = mem.org_id; S.orgName = mem.organizations?.name || "Safi TMS"; S.role = mem.role;
      $("orgTitle").textContent = S.orgName.replace(/ Limited$/, "");
      $("who").innerHTML = `${esc(S.email)} · ${esc(S.role)} · <button id="out">sign out</button>`;
      $("out").onclick = async () => { await S.sb.auth.signOut(); location.reload(); };
      await refreshAll();
      go("board");
    }

    // ---------------------------------------------------------------------
    // Data. One refresh loads everything every view needs.
    // ---------------------------------------------------------------------
    async function refreshAll() {
      const [board, billable, ar, fx, cust, rt, tk, dr, rc] = await Promise.all([
        S.sb.from("trip_board").select("*").order("actual_load_date", { ascending: false, nullsFirst: true }),
        S.sb.from("billable").select("*").order("trip_no", { ascending: false }),
        S.sb.from("invoice_ar").select("*").order("issued_on", { ascending: false }),
        S.sb.from("fx_rates").select("*").order("effective_on", { ascending: false }),
        S.sb.from("customers").select("*").order("name"),
        S.sb.from("routes").select("*").order("name"),
        S.sb.from("trucks").select("*").order("fleet_no"),
        S.sb.from("drivers").select("*").order("full_name"),
        S.sb.from("rate_cards").select("*").order("valid_from", { ascending: false })
      ]);
      const sources = {
        trips: board, billable, invoices: ar, "exchange rates": fx,
        customers: cust, routes: rt, trucks: tk, drivers: dr, "rate cards": rc
      };
      S.fetchErrors = Object.entries(sources).filter(([, r]) => r.error).map(([name]) => name);

      S.board = board.data || [];
      S.billable = (billable.data || []).filter(t => !t.loading_invoiced || (t.pod_in_hand && !t.delivery_invoiced));
      S.ar = ar.data || [];
      S.master = {
        fx: fx.data || [], customers: cust.data || [], routes: rt.data || [],
        trucks: tk.data || [], drivers: dr.data || [], rate_cards: rc.data || []
      };
      S.rates = {}; (fx.data || []).forEach(r => { if (!(r.currency in S.rates)) S.rates[r.currency] = r; });
      if (S.trip && !S.board.find(t => t.trip_id === S.trip)) S.trip = null;
      renderNav(); renderWarn();
    }

    async function loadTrip(id) {
      if (!id) { S.costs = []; S.docs = []; S.tripFetchError = null; return; }
      const [c, d] = await Promise.all([
        S.sb.from("trip_costs").select("*").eq("trip_id", id).order("incurred_on", { ascending: false }),
        S.sb.from("trip_documents").select("*").eq("trip_id", id).order("doc_type")
      ]);
      const failed = [c.error && "costs", d.error && "documents"].filter(Boolean);
      S.tripFetchError = failed.length ? failed.join(" and ") : null;
      S.costs = c.data || []; S.docs = d.data || [];
    }

    // ---------- nav ----------
    const VIEWS = [["board", "Board"], ["docket", "Cost docket"], ["billing", "Billing"], ["admin", "Admin"]];
    function renderNav() {
      const rolling = S.board.filter(t => ["loading", "in_transit", "at_border"].includes(t.status)).length;
      const pod = S.board.filter(t => t.status === "delivered" && !t.pod_in_hand).length;
      const overdue = S.ar.filter(i => i.days_overdue > 0).length;
      const counts = { board: [rolling, false], docket: [pod, pod > 0], billing: [S.billable.length + overdue, overdue > 0], admin: ["", false] };
      $("nav").innerHTML = VIEWS.map(([k, l]) => {
        const [c, alert] = counts[k];
        return `<button data-go="${k}" class="${S.view === k ? "on" : ""}">${l}${c !== "" && c > 0 ? `<span class="n ${alert ? "alert" : ""}">${c}</span>` : ""}</button>`;
      }).join("");
      document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
    }

    function renderWarn() {
      const latest = {};
      (S.master.fx || []).forEach(r => { if (!latest[r.currency] || r.effective_on > latest[r.currency]) latest[r.currency] = r.effective_on; });
      const old = Object.entries(latest).filter(([c, d]) => c !== "USD" && (new Date(today()) - new Date(d)) / 86400000 > 14);

      const parts = [];
      if (S.fetchErrors.length) parts.push(`<div class="note bad">Couldn't load ${esc(S.fetchErrors.join(", "))} — figures below may be missing or out of date. <a href="#" id="retryFetch" style="color:inherit">Retry</a>.</div>`);
      if (old.length) parts.push(`<div class="note warn">Exchange rates for ${old.map(([c]) => c).join(", ")} are more than two weeks old. Every cost entered today converts at those rates. <a href="#" id="fixFx" style="color:inherit">Update them</a>.</div>`);
      el("warn", parts.join(""));

      if ($("fixFx")) $("fixFx").onclick = e => { e.preventDefault(); S.adminView = "fx"; go("admin"); };
      if ($("retryFetch")) $("retryFetch").onclick = async e => { e.preventDefault(); await refreshAll(); go(S.view); };
    }

    function go(view) {
      S.view = view;
      $("viewName").textContent = VIEWS.find(v => v[0] === view)?.[1] || "";
      renderNav();
      ({ board: viewBoard, docket: viewDocket, billing: viewBilling, admin: viewAdmin })[view]();
    }

    // =====================================================================
    // BOARD
    // =====================================================================
    const FILTERS = [
      ["active", "Active", t => !["closed", "invoiced"].includes(t.status)],
      ["rolling", "Rolling", t => ["loading", "in_transit", "at_border"].includes(t.status)],
      ["border", "At border", t => t.status === "at_border"],
      ["pod", "Awaiting POD", t => t.status === "delivered" && !t.pod_in_hand],
      ["billable", "Billable", t => t.status === "pod_received"],
      ["late", "Late", t => t.over_target],
      ["all", "All", () => true]
    ];
    const NEXT = {
      draft: [["allocated", "Allocate truck"]], allocated: [["loading", "Start loading"]],
      loading: [["in_transit", "Depart"]], in_transit: [["delivered", "Mark delivered"]],
      at_border: [], delivered: [], pod_received: [["invoiced", "Mark invoiced"]], invoiced: [["closed", "Close trip"]]
    };

    function viewBoard() {
      const rolling = S.board.filter(t => ["loading", "in_transit", "at_border"].includes(t.status));
      const late = rolling.filter(t => t.over_target);
      const pod = S.board.filter(t => t.status === "delivered" && !t.pod_in_hand);
      const unbilled = pod.reduce((s, t) => s + Number(t.revenue_usd || 0) * 0.5, 0);
      const done = S.board.filter(t => ["pod_received", "invoiced", "closed"].includes(t.status));
      const avg = done.length ? done.reduce((s, t) => s + Number(t.margin_pct || 0), 0) / done.length : null;

      el("main", `
    <div class="strip">
      <div class="cell"><div class="k">On the road</div><div class="v">${rolling.length}</div>
        <div class="n">${S.board.filter(t => t.status !== "closed").length} open trips</div></div>
      <div class="cell"><div class="k">Over corridor target</div><div class="v ${late.length ? "warn" : ""}">${late.length}</div>
        <div class="n">${late.length ? esc(late.map(t => t.trip_no).join(", ")) : "all on schedule"}</div></div>
      <div class="cell"><div class="k">Awaiting POD</div><div class="v ${pod.length ? "warn" : ""}">${pod.length}</div>
        <div class="n">${m0(unbilled)} not yet billable</div></div>
      <div class="cell"><div class="k">Avg margin, delivered</div><div class="v ${avg >= 0 ? "pos" : ""}">${avg != null ? avg.toFixed(1) + "%" : "—"}</div>
        <div class="n">${done.length} trips</div></div>
    </div>
    <div class="grid">
      <div class="panel">
        <div class="panel-head"><h2>Trips</h2><button class="act" id="newTrip">+ New trip</button></div>
        <div class="chips" id="chips"></div>
        <ul class="list" id="trips"></ul>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 id="sideT">Trip detail</h2></div>
        <div id="side"><div class="empty">Select a trip, or start a new one.</div></div>
      </div>
    </div>`);
      $("newTrip").onclick = newTripForm;
      boardChips(); boardList();
      if (S.trip) boardDetail(S.trip);
    }

    function boardChips() {
      el("chips", FILTERS.map(([k, l, fn]) =>
        `<button class="chip ${S.filter === k ? "on" : ""}" data-f="${k}">${l}<span class="c">${S.board.filter(fn).length}</span></button>`).join(""));
      document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filter = b.dataset.f; boardChips(); boardList() });
    }

    function boardList() {
      const fn = FILTERS.find(f => f[0] === S.filter)[2];
      const rows = S.board.filter(fn);
      el("trips", rows.length ? rows.map(t => {
        const m = Number(t.margin_usd || 0);
        const tags = [
          `<span class="pill ${PILL[t.status] || "grey"}">${lab(t.status)}</span>`,
          t.over_target ? `<span class="pill bad">day ${t.days_running} of ${t.target_days}</span>`
            : (t.days_running != null ? `<span class="pill grey">day ${t.days_running}</span>` : ""),
          t.last_border && ["in_transit", "at_border"].includes(t.status) ? `<span class="pill violet">${esc(t.last_border)}</span>` : "",
          t.docs_pending ? `<span class="pill warn">${t.docs_pending} doc${t.docs_pending > 1 ? "s" : ""}</span>` : "",
          t.status === "delivered" && !t.pod_in_hand ? `<span class="pill warn">no POD</span>` : ""
        ].filter(Boolean).join("");
        return `<li class="tap ${S.trip === t.trip_id ? "sel" : ""}" data-t="${t.trip_id}">
      <div><div class="r-no">${esc(t.trip_no)}</div>
        <div class="r-title">${esc(t.customer)}</div>
        <div class="r-sub">${esc(t.route)}${t.fleet_no ? " · " + esc(t.fleet_no) : ""}${t.driver ? " · " + esc(t.driver) : ""}</div>
        <div class="r-tags">${tags}</div></div>
      <div class="r-right"><div class="r-amt ${m >= 0 ? "pos" : "neg"}">${m0(m)}</div>
        <div class="r-min">${t.margin_pct != null ? t.margin_pct + "%" : "—"}</div>
        <div class="r-min">${t.cost_entries} costs</div></div>
    </li>`;
      }).join("") : '<li class="empty">Nothing here.</li>');
      document.querySelectorAll("[data-t]").forEach(li => li.onclick = () => { S.trip = li.dataset.t; boardList(); boardDetail(S.trip) });
    }

    function boardDetail(id) {
      const t = S.board.find(x => x.trip_id === id); if (!t) return;
      const m = Number(t.margin_usd || 0), borders = t.borders || [];
      const canBorder = ["in_transit", "at_border"].includes(t.status);
      const nexts = (NEXT[t.status] || []).map(([s, l]) => `<button class="act ${s === "delivered" ? "go" : ""}" data-adv="${s}">${l}</button>`).join("");

      el("side", `
    <div class="d-head">
      <div class="r-no">${esc(t.trip_no)} · <span class="pill ${PILL[t.status] || "grey"}">${lab(t.status)}</span></div>
      <div class="r-title" style="font-size:18px">${esc(t.customer)}</div>
      <div class="r-sub">${esc(t.route)}</div>
      <div class="d-figs">
        <div><div class="k">Revenue</div><div class="v">${m2(t.revenue_usd)}</div></div>
        <div><div class="k">Costs</div><div class="v">${m2(t.cost_usd)}</div></div>
        <div><div class="k">Margin</div><div class="v ${m >= 0 ? "pos" : "neg"}">${m2(m)}</div></div>
      </div>
    </div>
    <div class="d-sec"><h3>Go to</h3><div class="acts">
      <button class="act" id="toDocket">Costs &amp; documents</button>
      ${(!t.pod_in_hand && t.status === "delivered") || ["pod_received", "in_transit", "at_border", "loading"].includes(t.status)
          ? `<button class="act" id="toBilling">Billing</button>` : ""}
    </div></div>
    ${nexts ? `<div class="d-sec"><h3>Next step</h3><div class="acts">${nexts}</div></div>` : ""}
    ${canBorder ? `<div class="d-sec"><h3>Border</h3><div class="acts">
      ${t.status === "in_transit" ? borders.map(b => `<button class="act" data-bd="arrival" data-loc="${esc(b)}">Arrived ${esc(b.split("/")[0])}</button>`).join("")
            : `<button class="act go" data-bd="cleared" data-loc="${esc(t.last_border || borders[0] || "")}">Cleared ${esc((t.last_border || borders[0] || "border").split("/")[0])}</button>`}
    </div></div>`: ""}
    ${t.status === "delivered" && !t.pod_in_hand ? `<div class="d-sec"><h3>Blocked on</h3>
      <div class="d-hint">POD not received. ${m2(Number(t.revenue_usd || 0) * 0.5)} can't be invoiced until it's in hand.</div></div>` : ""}
    <div class="d-sec"><h3>Assignment</h3>
      <div class="d-kv"><span>Truck</span><span>${esc(t.fleet_no || "—")}${t.horse_reg ? " · " + esc(t.horse_reg) : ""}</span></div>
      <div class="d-kv"><span>Driver</span><span>${esc(t.driver || "—")}</span></div>
      <div class="d-kv"><span>Cargo</span><span>${esc(t.commodity || "—")}${t.tonnage ? " · " + t.tonnage + " t" : ""}</span></div>
      <div class="d-kv"><span>Container</span><span>${esc(t.container_no || "—")}</span></div>
    </div>
    <div class="d-sec"><h3>Timing</h3>
      <div class="d-kv"><span>Loaded</span><span>${t.actual_load_date || "—"}</span></div>
      <div class="d-kv"><span>Planned ETA</span><span>${t.planned_eta || "—"}</span></div>
      <div class="d-kv"><span>Delivered</span><span>${t.actual_delivery_at ? t.actual_delivery_at.slice(0, 10) : "—"}</span></div>
      <div class="d-kv"><span>Days running</span><span>${t.days_running != null ? t.days_running + " of " + (t.target_days ?? "?") : "—"}</span></div>
      <div class="d-kv"><span>Last border</span><span>${esc(t.last_border || "—")}</span></div>
    </div>
    <div class="panel-body" style="padding-top:0"><div id="actNote"></div></div>`);

      $("toDocket").onclick = () => go("docket");
      if ($("toBilling")) $("toBilling").onclick = () => go("billing");
      document.querySelectorAll("[data-adv]").forEach(b => b.onclick = () => advance(id, b.dataset.adv, [...document.querySelectorAll("[data-adv]")]));
      document.querySelectorAll("[data-bd]").forEach(b => b.onclick = () => borderEvent(id, b.dataset.bd, b.dataset.loc, [...document.querySelectorAll("[data-bd]")]));
    }

    async function advance(id, status, btns) {
      const restore = busyGroup(btns);
      const patch = { status };
      if (status === "delivered") patch.actual_delivery_at = new Date().toISOString();
      if (status === "closed") patch.closed_at = new Date().toISOString();
      const { error } = await S.sb.from("trips").update(patch).eq("id", id);
      if (error) { restore(); return note("actNote", "Couldn't update: " + errMsg(error), "bad"); }

    async function prepare(file) {
      if (!file.type.startsWith("image/")) return file;
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file) });
      const max = 1600, scale = Math.min(1, max / Math.max(img.width, img.height));
      if (scale === 1 && file.size < 900000) return file;
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
      URL.revokeObjectURL(img.src);
      return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
    }
    function wireCapture(p, onPick, idle) {
      const f = $(p + "File"), btn = $(p + "Btn"), box = $(p), st = $(p + "State"), th = $(p + "Thumb"), cl = $(p + "Clear");
      btn.onclick = () => f.click();
      f.onchange = async () => {
        const raw = f.files[0]; if (!raw) return;
        st.textContent = "Preparing…";
        const ready = await prepare(raw); onPick(ready);
        box.classList.add("has");
        st.innerHTML = `<b>${esc(ready.name)}</b> · ${(ready.size / 1024).toFixed(0)} KB`;
        cl.style.display = "inline";
        if (ready.type.startsWith("image/")) { th.src = URL.createObjectURL(ready); th.style.display = "block" } else th.style.display = "none";
      };
      cl.onclick = () => { f.value = ""; onPick(null); box.classList.remove("has"); th.style.display = "none"; cl.style.display = "none"; st.textContent = idle };
    }
    async function upload(file) {

      if (error) throw error;
      return path;

        const payload = { storage_path: path, doc_number: $("dNum").value.trim() || null, status: "issued", issued_on: today() };

          : await S.sb.from("trip_documents").insert({ org_id: S.org, trip_id: S.trip, doc_type: type, ...payload });

        await refreshAll(); await loadTrip(S.trip); renderDocket();

    // =====================================================================

      const raisable = S.billable.reduce((s, t) => s + (!t.loading_invoiced ? Number(t.half_usd) : 0) + ((t.pod_in_hand && !t.delivery_invoiced) ? Number(t.half_usd) : 0), 0);

      const blockedVal = blocked.reduce((s, t) => s + Number(t.half_usd), 0);

      el("main", `
    <div class="strip">
      <div class="cell"><div class="k">Ready to raise</div><div class="v pos">${m0(raisable)}</div><div class="n">${S.billable.length} trip${S.billable.length === 1 ? "" : "s"}</div></div>

          <button id="bTab1" class="${S.billTab === "bill" ? "on" : ""}">Ready to bill <span class="c">${S.billable.length || ""}</span></button>
          <button id="bTab2" class="${S.billTab === "inv" ? "on" : ""}">Receivables <span class="c">${out.length || ""}</span></button>
        </div>
        <div class="chips" id="bChips" style="display:${S.billTab === "inv" ? "flex" : "none"}"></div>

      <div class="panel">
        <div class="panel-head"><h2 id="bSideT">Detail</h2></div>
        <div id="bSide"><div class="empty">Pick a trip to bill, or an invoice to settle.</div></div>
      </div>
    </div>`);
      $("bTab1").onclick = () => { S.billTab = "bill"; S.billSel = null; viewBilling() };
      $("bTab2").onclick = () => { S.billTab = "inv"; S.billSel = null; viewBilling() };
      if (S.billTab === "inv") billChips();
      billRows();
      if (S.billTab === "bill" && S.trip && S.billable.find(t => t.trip_id === S.trip)) { S.billSel = S.trip; billTrip(S.trip); }
      else if (S.billSel) S.billTab === "bill" ? billTrip(S.billSel) : billInvoice(S.billSel);
    }
    function billChips() {
      el("bChips", BUCKETS.map(([k, l, fn]) => `<button class="chip ${S.bucket === k ? "on" : ""}" data-bk="${k}">${l}<span class="c">${S.ar.filter(fn).length}</span></button>`).join(""));
      document.querySelectorAll("[data-bk]").forEach(b => b.onclick = () => { S.bucket = b.dataset.bk; billChips(); billRows() });
    }
    function billRows() {
      if (S.billTab === "bill") {
        el("bRows", S.billable.length ? S.billable.map(t => {
          const tags = [!t.loading_invoiced ? '<span class="pill violet">loading half due</span>' : "",
          t.pod_in_hand && !t.delivery_invoiced ? '<span class="pill good">delivery half due</span>' : "",

        <div><div class="r-no">${esc(t.trip_no)}</div><div class="r-title">${esc(t.customer)}</div>
          <div class="r-sub">${esc(t.route)}</div><div class="r-tags">${tags}</div></div>
        <div class="r-right"><div class="r-amt">${m0(t.revenue_usd)}</div><div class="r-min">half ${m0(t.half_usd)}</div></div></li>`;

        el("bRows", rows.length ? rows.map(i => {
          const st = Number(i.outstanding) <= 0 ? "good" : (i.days_overdue > 0 ? "bad" : "violet");
          return `<li class="tap ${S.billSel === i.id ? "sel" : ""}" data-br="${i.id}">

          <div class="r-tags"><span class="pill ${st}">${Number(i.outstanding) <= 0 ? "settled" : lab(i.status)}</span>

        <div class="r-right"><div class="r-amt">${m0(i.outstanding, i.currency)}</div>

        }).join("") : '<li class="empty">Nothing here.</li>');
      }
      document.querySelectorAll("[data-br]").forEach(li => li.onclick = () => {
        S.billSel = li.dataset.br; billRows();

    function billTrip(id) {

    </div>`);

    async function raise(tripId, type, btns) {
      const restore = busyGroup(btns);
      const { data, error } = await S.sb.rpc("raise_invoice", { p_trip: tripId, p_type: type });
      if (error) { restore(); return note("raiseNote", errMsg(error), "bad"); }
      await refreshAll(); toast("Invoice raised");
      S.billTab = "inv"; S.billSel = data; viewBilling(); billInvoice(data);
    }
    async function billInvoice(id) {
      const i = S.ar.find(x => x.id === id); if (!i) return;
      $("bSideT").textContent = "Invoice";
      const { data: pays } = await S.sb.from("payments").select("*").eq("invoice_id", id).order("received_on");
      const cancelled = i.status === "cancelled";
      const settled = Number(i.outstanding) <= 0;
      const paid = Number(i.paid) || 0;
      el("bSide", `
    <div class="d-head"><div class="r-no">${esc(i.invoice_no)}${cancelled ? ' · <span class="pill bad">cancelled</span>' : ""}</div>
      <div class="r-title" style="font-size:18px">${esc(i.customer)}</div>
      <div class="r-sub">${lab(i.invoice_type)} · ${esc(i.trips || "")}</div>

        <div><div class="k">Invoiced</div><div class="v">${m2(i.total_due, i.currency)}</div></div>
        <div><div class="k">Paid</div><div class="v pos">${m2(i.paid, i.currency)}</div></div>
        <div><div class="k">Outstanding</div><div class="v ${settled ? "pos" : (i.days_overdue > 0 ? "bad" : "")}">${m2(i.outstanding, i.currency)}</div></div>
      </div></div>
    ${cancelled ? `<div class="d-sec"><h3>Cancelled</h3>
      <div class="d-hint">${i.cancelled_at ? esc(i.cancelled_at.slice(0, 10)) : ""} — ${esc(i.cancel_reason || "no reason recorded")}</div></div>` : ""}
    <div class="d-sec"><div class="acts">
      <button class="act" id="printBtn">Print / PDF</button>
      ${!cancelled && paid === 0 ? `<button class="act" id="cancelBtn" style="border-color:var(--alert);color:var(--alert)">Cancel invoice</button>` : ""}
    </div>
    ${!cancelled && paid > 0 ? `<div class="d-hint" style="margin-top:9px">Can't be cancelled — ${m2(paid, i.currency)} has already been recorded against it.</div>` : ""}
    <div id="cancelForm"></div></div>
    <div class="d-sec"><h3>Terms</h3>
      <div class="d-kv"><span>Issued</span><span>${i.issued_on}</span></div>
      <div class="d-kv"><span>Due</span><span>${i.due_on}${i.days_overdue > 0 ? ` · ${i.days_overdue}d overdue` : ""}</span></div>
      <div class="d-kv"><span>Ageing</span><span>${i.bucket}</span></div></div>
    <div class="d-sec"><h3>Payments received</h3>
      ${(pays || []).length ? pays.map(p => `<div class="d-kv"><span>${p.received_on}${p.method ? " · " + esc(p.method) : ""}${p.reference ? " · " + esc(p.reference) : ""}</span><span>${m2(p.amount, p.currency)}</span></div>`).join("")
          : '<div class="d-hint">Nothing received yet.</div>'}</div>
    ${!settled ? `<div class="panel-body"><div id="payNote"></div>
      <div class="row">
        <div class="field"><label for="pAmt">Amount</label><input id="pAmt" type="number" step="0.01" min="0" value="${Number(i.outstanding).toFixed(2)}"></div>
        <div class="field"><label for="pDate">Received on</label><input id="pDate" type="date" value="${today()}"></div></div>
      <div class="row">
        <div class="field"><label for="pMethod">Method</label><select id="pMethod">
          <option>Bank transfer</option><option>Cash</option><option>Mobile money</option><option>Cheque</option></select></div>
        <div class="field"><label for="pRef">Reference</label><input id="pRef" type="text"></div></div>
      <button class="primary settle" id="payBtn">Record payment</button></div>`: ""}`);
      $("printBtn").onclick = () => printInvoice(id);
      if ($("cancelBtn")) $("cancelBtn").onclick = () => showCancelForm(id);
      if (!settled) $("payBtn").onclick = () => pay(id, i.currency);
    }
    function showCancelForm(id) {
      el("cancelForm", `<div class="panel-body" style="background:#FAEFEC;border-top:1px solid var(--alert);margin-top:9px">
      <div id="cancelNote"></div>
      <div class="field"><label for="cReason">Reason for cancelling</label>
        <input id="cReason" type="text" placeholder="e.g. raised against the wrong customer"></div>

      <button class="ghost" id="cancelDismiss">Never mind</button>
    </div>`);
      $("cancelConfirm").onclick = () => cancelInvoiceAction(id);

    async function cancelInvoiceAction(id) {
      const reason = $("cReason").value.trim();
      if (!reason) return note("cancelNote", "A reason is required.", "bad");
      const b = $("cancelConfirm"); b.disabled = true; b.textContent = "Cancelling…";
      const { error } = await S.sb.rpc("cancel_invoice", { p_invoice: id, p_reason: reason });
      if (error) { b.disabled = false; b.textContent = "Confirm cancellation"; return note("cancelNote", errMsg(error), "bad"); }

      await refreshAll(); viewBilling(); billInvoice(id);
    }
    async function pay(id, currency) {
      const amt = parseFloat($("pAmt").value);
      if (isNaN(amt) || amt <= 0) return note("payNote", "Enter an amount greater than zero.", "bad");
      const b = $("payBtn"); b.disabled = true; b.textContent = "Recording…";
      const { error } = await S.sb.from("payments").insert({
        org_id: S.org, invoice_id: id, amount: amt, currency, received_on: $("pDate").value,
        method: $("pMethod").value, reference: $("pRef").value.trim() || null
      });
      b.disabled = false; b.textContent = "Record payment";
      if (error) return note("payNote", "Couldn't record it: " + errMsg(error), "bad");
      toast("Payment recorded");
      await refreshAll(); viewBilling(); billInvoice(id);
    }

          m: [r.commodity, r.rate_basis?.replace("_", " ")].filter(Boolean).join(" · "),
          r: `${r.rate_currency} ${num(r.rate_amount)}`,
          tag: r.valid_to && r.valid_to < today() ? ["grey", "expired"] : ["good", "current"]
        })
      }
    };

    function viewAdmin() {
      el("main", `
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px" id="aNav"></div>
    <div class="grid">
      <div class="panel">
        <div class="panel-head"><h2 id="aTitle"></h2><button class="act" id="aNew">+ New</button></div>
        <ul class="list" id="aList"></ul>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 id="aFormT">Detail</h2></div>
        <div class="panel-body" id="aForm"><div class="empty">Pick a record, or add a new one.</div></div>
      </div>
    </div>`);
      el("aNav", Object.entries(ENT).map(([k, e]) =>
        `<button class="chip ${S.adminView === k ? "on" : ""}" data-a="${k}">${e.label}<span class="c">${(S.master[k] || []).length}</span></button>`).join(""));
      document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { S.adminView = b.dataset.a; S.adminSel = null; viewAdmin() });
      $("aNew").onclick = () => { S.adminSel = null; adminList(); adminForm(null) };
      adminList();
      if (S.adminView === "fx") fxForm();
    }
    function adminList() {
      const k = S.adminView, e = ENT[k];
      $("aTitle").textContent = e.label;
      if (k === "fx") {
        const rows = S.master.fx || [], latest = {};
        rows.forEach(r => { if (!latest[r.currency] || r.effective_on > latest[r.currency].effective_on) latest[r.currency] = r; });
        el("aList", rows.length ? rows.map(r => {
          const per = Number(r.rate_to_usd) > 0 ? 1 / Number(r.rate_to_usd) : 0;
          return `<li><div><div class="r-title">${esc(r.currency)}</div>
        <div class="r-mono">1 ${esc(r.currency)} = ${Number(r.rate_to_usd).toFixed(8)} USD</div>
        <div class="r-tags">${latest[r.currency]?.id === r.id ? '<span class="pill good">in use</span>' : '<span class="pill grey">superseded</span>'}</div></div>
        <div class="r-right"><div class="r-amt" style="font-size:13px">${r.currency === "USD" ? "—" : num(per) + " / USD"}</div>
        <div class="r-min">${r.effective_on}</div></div></li>`;
        }).join("") : '<li class="empty">No rates yet.</li>');
        return;
      }
      const rows = S.master[k] || [];
      el("aList", rows.length ? rows.map(r => {
        const v = e.row(r);
        return `<li class="tap ${S.adminSel === r.id ? "sel" : ""} ${v.off ? "off" : ""}" data-ar="${r.id}">
      <div><div class="r-title">${esc(v.t)}</div>
        ${v.s ? `<div class="r-sub">${esc(v.s)}</div>` : ""}
        ${v.m ? `<div class="r-mono">${esc(v.m)}</div>` : ""}
        ${v.off ? '<div class="r-tags"><span class="pill grey">inactive</span></div>'
            : v.tag ? `<div class="r-tags"><span class="pill ${v.tag[0]}">${v.tag[1]}</span></div>` : ""}</div>
      <div class="r-right"><div class="r-min">${esc(v.r || "")}</div></div></li>`;
      }).join("") : `<li class="empty">No ${e.label.toLowerCase()} yet.</li>`);
      document.querySelectorAll("[data-ar]").forEach(li => li.onclick = () => { S.adminSel = li.dataset.ar; adminList(); adminForm(S.adminSel) });
    }
    function adminForm(id) {
      if (S.adminView === "fx") return fxForm();
      const e = ENT[S.adminView], r = id ? (S.master[S.adminView] || []).find(x => x.id === id) : null;
      $("aFormT").textContent = r ? "Edit" : "New " + e.label.toLowerCase().replace(/s$/, "");
      const val = f => r ? r[f.k] : (typeof f.def === "function" ? f.def() : f.def);
      const inp = f => {
        const v = val(f);
        if (f.type === "bool") return `<div class="check"><input type="checkbox" id="af_${f.k}" ${v ? "checked" : ""}><label for="af_${f.k}">${f.label}</label></div>`;
        let c;
        if (f.type === "select") c = `<select id="af_${f.k}">${f.opts.map(o => `<option ${v === o ? "selected" : ""}>${o}</option>`).join("")}</select>`;
        else if (f.type === "fk") {
          const src = (S.master[f.from] || []).filter(x => x.is_active !== false);
          c = `<select id="af_${f.k}"><option value="">—</option>${src.map(o => `<option value="${o.id}" ${v === o.id ? "selected" : ""}>${esc(o[f.lab])}</option>`).join("")}</select>`;
        }
        else if (f.type === "tags") c = `<input id="af_${f.k}" type="text" value="${esc((v || []).join(", "))}">`;
        else c = `<input id="af_${f.k}" type="${f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}" ${f.type === "number" ? 'step="any"' : ""} value="${esc(v ?? "")}">`;
        return `<div class="field"><label for="af_${f.k}">${f.label}${f.req ? " *" : ""}</label>${c}${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div>`;
      };
      let html = "", i = 0;
      while (i < e.fields.length) {
        const f = e.fields[i];
        if (f.half && e.fields[i + 1]?.half) { html += `<div class="row">${inp(f)}${inp(e.fields[i + 1])}</div>`; i += 2; }
        else { html += inp(f); i++; }
      }
      el("aForm", `<div id="aNote"></div>${html}
    <button class="primary" id="aSave">${r ? "Save changes" : "Create"}</button>
    ${r && e.fields.some(f => f.k === "is_active") ? `<button class="ghost danger" id="aToggle">${r.is_active ? "Deactivate" : "Reactivate"}</button>` : ""}
    <button class="ghost" id="aCancel">Cancel</button>`);
      $("aSave").onclick = () => adminSave(id);
      $("aCancel").onclick = () => { S.adminSel = null; adminList(); el("aForm", '<div class="empty">Pick a record, or add a new one.</div>') };
      if ($("aToggle")) $("aToggle").onclick = () => adminToggle(id, !r.is_active, $("aToggle"));
    }
    async function adminSave(id) {
      const e = ENT[S.adminView], p = {};
      for (const f of e.fields) {
        const x = $("af_" + f.k); if (!x) continue;
        let v;
        if (f.type === "bool") v = x.checked;
        else if (f.type === "number") v = x.value === "" ? null : Number(x.value);
        else if (f.type === "tags") v = x.value.split(",").map(s => s.trim()).filter(Boolean);
        else v = x.value.trim() === "" ? null : x.value.trim();
        if (f.req && (v === null || v === "")) return note("aNote", `${f.label} is required.`, "bad");
        p[f.k] = v;
      }
      const b = $("aSave"); b.disabled = true; b.textContent = "Saving…";
      const { error } = id ? await S.sb.from(e.table).update(p).eq("id", id)
        : await S.sb.from(e.table).insert({ org_id: S.org, ...p });
      b.disabled = false; b.textContent = id ? "Save changes" : "Create";
      if (error) return note("aNote", errMsg(error), "bad");
      toast("Saved"); S.adminSel = null; await refreshAll(); viewAdmin();
    }
    async function adminToggle(id, active, btn) {
      const restore = busyGroup(btn);
      const { error } = await S.sb.from(ENT[S.adminView].table).update({ is_active: active }).eq("id", id);
      if (error) { restore(); return note("aNote", errMsg(error), "bad"); }
      await refreshAll(); viewAdmin(); S.adminSel = id; adminList(); adminForm(id);
    }

    // FX entered the way it's quoted, inverted on save.
    function fxForm() {
      $("aFormT").textContent = "Add a rate";
      const cur = ["TZS", "ZMW", "CDF", "USD", "RWF", "ZAR"];
      el("aForm", `<div id="aNote"></div>
    <div class="field"><label for="xCur">Currency</label><select id="xCur">${cur.map(c => `<option>${c}</option>`).join("")}</select></div>
    <div class="field"><label for="xPer">Units per 1 USD</label><input id="xPer" type="number" step="any" min="0" placeholder="2600">
      <div class="hint">Enter it the way it's quoted — how many of this currency buy one dollar.</div></div>
    <div class="mirror" id="xMir"><div class="big" id="xBig">—</div>
      <div class="small" id="xSmall">This is what gets stored and frozen onto every cost entered at this rate.</div></div>
    <div class="field"><label for="xDate">Effective from</label><input id="xDate" type="date" value="${today()}"></div>
    <div class="field"><label for="xSrc">Source</label><input id="xSrc" type="text" placeholder="BoZ / bureau / bank"></div>
    <button class="primary" id="xSave">Add rate</button>
    <div class="hint" style="margin-top:9px">Rates are never edited — a new row supersedes the old one, and past costs keep the rate they were entered at.</div>`);
      const upd = () => {
        const per = parseFloat($("xPer").value), c = $("xCur").value;
        if (isNaN(per) || per <= 0) { $("xBig").textContent = "—"; $("xBig").classList.remove("on"); $("xMir").classList.remove("live"); return; }
        $("xBig").textContent = `1 ${c} = ${(1 / per).toFixed(8)} USD`;
        $("xBig").classList.add("on"); $("xMir").classList.add("live");
        $("xSmall").textContent = `${num(per)} ${c} to the dollar. A 10,000 ${c} border fee would post as USD ${(10000 / per).toFixed(2)}.`;
      };
      $("xPer").oninput = upd;
      $("xCur").onchange = () => { if ($("xCur").value === "USD") $("xPer").value = 1; upd(); };
      $("xSave").onclick = async () => {
        const per = parseFloat($("xPer").value), c = $("xCur").value, d = $("xDate").value;
        if (isNaN(per) || per <= 0) return note("aNote", "Enter how many units buy one dollar.", "bad");
        const b = $("xSave"); b.disabled = true; b.textContent = "Saving…";
        const { error } = await S.sb.from("fx_rates").upsert({
          org_id: S.org, currency: c, rate_to_usd: 1 / per, effective_on: d, source: $("xSrc").value.trim() || null
        }, { onConflict: "org_id,currency,effective_on" });
        b.disabled = false; b.textContent = "Add rate";
        if (error) return note("aNote", errMsg(error), "bad");
        toast(`${c} set at ${num(per)} to the dollar`);
        await refreshAll(); viewAdmin();
      };
    }
  </script>
</body>

</html>
